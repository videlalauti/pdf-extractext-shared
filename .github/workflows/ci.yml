name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pypdf]"

      - name: ruff check
        run: ruff check .

      - name: pytest
        run: pytest tests/ -v

  install-from-url:
    name: instalar desde la URL del tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar el paquete desde el zip del tag, sin git ni registry
        run: |
          python -m pip install --upgrade pip
          pip install "https://github.com/videlalauti/pdf-extractext-shared/archive/refs/tags/v1.0.0.zip"

      - name: Verificar la instalación y sus metadatos
        run: |
          python - <<'PY'
          from importlib.metadata import version

          from shared.domain.pdf_validator import PdfValidator
          import shared.web.cors
          import shared.web.logging
          import shared.web.resilience

          assert version("pdf-extractext-shared") == "1.0.0", "versión inesperada"

          validator = PdfValidator(max_size_bytes=1024)
          assert validator.validate(b"%PDF-1.4").is_valid is True
          assert validator.validate(b"not a pdf").is_valid is False
          assert validator.validate(b"").is_valid is False

          print("instalación OK: pdf-extractext-shared", version("pdf-extractext-shared"))
          PY

      - name: El dominio no debe arrastrar pypdf
        run: |
          # validation/persistence/summary instalan sin el extra pypdf: si el
          # paquete lo importara al cargar, los 3 servicios no podrían arrancar.
          python - <<'PY'
          import importlib.util

          import shared.domain
          from shared.domain import MAX_PDF_SIZE_BYTES, PdfValidator, has_pdf_extension

          assert has_pdf_extension("a.pdf") is True
          assert MAX_PDF_SIZE_BYTES == 10 * 1024 * 1024
          assert PdfValidator(MAX_PDF_SIZE_BYTES).validate(b"%PDF-1.4").is_valid is True

          assert importlib.util.find_spec("pypdf") is None, "pypdf no debería estar instalado"

          try:
              shared.domain.PyPdfTextExtractor
          except ModuleNotFoundError as e:
              print("import diferido de PyPdfTextExtractor:", e.name)
          else:
              raise AssertionError("pypdf se importó sin estar instalado")

          print("shared.domain importa sin pypdf: OK")
          PY
